<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CodeBattle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #080b10;
    --bg1:     #0d1117;
    --bg2:     #161b22;
    --bg3:     #1c2330;
    --bg4:     #21262d;
    --border:  #30363d;
    --border2: #484f58;
    --text:    #e6edf3;
    --text2:   #8b949e;
    --text3:   #484f58;
    --accent:  #00d4ff;
    --accent2: #0099bb;
    --accent3: #58e6ff;
    --green:   #3fb950;
    --green2:  #238636;
    --red:     #f85149;
    --yellow:  #d29922;
    --yellow2: #e3b341;
    --purple:  #bc8cff;
  }
  html, body, #root { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  .app { height: 100%; display: flex; flex-direction: column; }

  /* Nav */
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 48px; background: var(--bg1); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .nav-logo { font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .nav-logo-bracket { color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .nav-user { color: var(--text2); font-size: 12px; font-family: 'Space Mono', monospace; background: var(--bg2); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 600; transition: all 0.15s ease; white-space: nowrap; }
  .btn-primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent3); border-color: var(--accent3); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,212,255,0.25); }
  .btn-ghost { background: transparent; color: var(--text2); border-color: var(--border); }
  .btn-ghost:hover { border-color: var(--border2); color: var(--text); background: var(--bg2); }
  .btn-success { background: var(--green2); color: #fff; border-color: var(--green); }
  .btn-success:hover { background: var(--green); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(63,185,80,0.25); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
  .btn-sm { padding: 5px 10px; font-size: 11px; }
  .btn-lg { padding: 11px 22px; font-size: 14px; }

  /* Auth */
  .auth-page { flex: 1; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse 60% 40% at 20% 60%, rgba(0,212,255,0.06) 0%, transparent 70%), radial-gradient(ellipse 40% 50% at 80% 20%, rgba(188,140,255,0.04) 0%, transparent 60%), var(--bg); }
  .auth-wrap { width: 100%; max-width: 400px; padding: 20px; }
  .auth-header { text-align: center; margin-bottom: 28px; }
  .auth-logo { font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .auth-logo span { color: var(--accent); }
  .auth-tagline { color: var(--text3); font-size: 11px; font-family: 'Space Mono', monospace; }
  .auth-card { background: var(--bg1); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .auth-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .auth-tab { flex: 1; padding: 13px; text-align: center; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text2); transition: all 0.15s; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(0,212,255,0.03); }
  .auth-body { padding: 26px; }
  .form-group { margin-bottom: 15px; }
  .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--text2); margin-bottom: 6px; letter-spacing: 0.8px; text-transform: uppercase; }
  .form-input { width: 100%; padding: 9px 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-family: 'Outfit', sans-serif; font-size: 13px; transition: border-color 0.15s, box-shadow 0.15s; outline: none; }
  .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,255,0.1); }
  .form-input::placeholder { color: var(--text3); }
  .form-error { color: var(--red); font-size: 12px; margin-top: 12px; padding: 10px 12px; background: rgba(248,81,73,0.08); border: 1px solid rgba(248,81,73,0.2); border-radius: 6px; }

  /* Layout */
  .main { flex: 1; display: flex; overflow: hidden; }
  .content { flex: 1; overflow-y: auto; }

  /* Sidebar */
  .sidebar { width: 216px; flex-shrink: 0; background: var(--bg1); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .sidebar-section { padding: 12px 10px; }
  .sidebar-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text3); padding: 4px 8px; margin-bottom: 4px; }
  .sidebar-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; margin-bottom: 2px; background: transparent; border: none; border-radius: 7px; cursor: pointer; color: var(--text2); font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 500; text-align: left; transition: all 0.12s; }
  .sidebar-btn:hover { background: var(--bg2); color: var(--text); }
  .sidebar-btn.active { background: rgba(0,212,255,0.08); color: var(--accent); }
  .sidebar-icon { font-size: 15px; width: 18px; text-align: center; }

  /* Home */
  .home-page { padding: 40px; max-width: 720px; }
  .home-greeting { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
  .home-title { font-size: 30px; font-weight: 800; line-height: 1.15; margin-bottom: 12px; }
  .home-title span { color: var(--accent); }
  .home-desc { color: var(--text2); font-size: 14px; max-width: 480px; margin-bottom: 32px; line-height: 1.7; }
  .home-cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .home-card { padding: 20px; background: var(--bg1); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.15s; }
  .home-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
  .home-card-icon { font-size: 26px; margin-bottom: 10px; }
  .home-card-title { font-size: 14px; font-weight: 700; margin-bottom: 5px; }
  .home-card-desc { color: var(--text2); font-size: 12px; line-height: 1.6; }

  /* Problems */
  .problems-page { padding: 24px; }
  .page-header { margin-bottom: 18px; }
  .page-title { font-size: 20px; font-weight: 700; margin-bottom: 3px; }
  .page-sub { color: var(--text2); font-size: 12px; font-family: 'Space Mono', monospace; }
  .problem-grid { display: flex; flex-direction: column; gap: 6px; }
  .problem-card { display: flex; align-items: center; justify-content: space-between; padding: 13px 18px; background: var(--bg1); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.12s; }
  .problem-card:hover { border-color: var(--border2); background: var(--bg2); transform: translateX(3px); }
  .problem-left { display: flex; align-items: center; gap: 14px; }
  .problem-num { color: var(--text3); font-size: 11px; font-family: 'Space Mono', monospace; width: 24px; }
  .problem-name { font-weight: 500; font-size: 13px; }
  .problem-right { display: flex; align-items: center; gap: 10px; }
  .badge { padding: 2px 9px; border-radius: 99px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge-easy { background: rgba(63,185,80,0.1); color: var(--green); border: 1px solid rgba(63,185,80,0.2); }
  .badge-medium { background: rgba(227,179,65,0.1); color: var(--yellow2); border: 1px solid rgba(227,179,65,0.2); }
  .badge-hard { background: rgba(248,81,73,0.1); color: var(--red); border: 1px solid rgba(248,81,73,0.2); }

  /* Split view */
  .split-view { display: flex; height: 100%; overflow: hidden; }
  .split-left { width: 40%; min-width: 300px; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; background: var(--bg1); }
  .split-right { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--bg1); border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 10px; min-height: 44px; }
  .panel-body { flex: 1; overflow-y: auto; padding: 20px; }
  .prob-title { font-size: 17px; font-weight: 700; margin-bottom: 12px; }
  .prob-desc { color: var(--text2); line-height: 1.8; font-size: 13px; white-space: pre-wrap; }

  /* Editor */
  .editor-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: var(--bg1); border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 10px; }
  .editor-tabs { display: flex; gap: 2px; }
  .editor-tab { padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--text2); border: none; background: transparent; font-family: 'Outfit', sans-serif; transition: all 0.12s; display: flex; align-items: center; gap: 5px; }
  .editor-tab.active { background: var(--bg3); color: var(--text); }
  .editor-tab:hover:not(.active) { background: var(--bg2); color: var(--text); }
  .editor-controls { display: flex; align-items: center; gap: 8px; }
  .lang-select { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; color: var(--text2); font-family: 'Space Mono', monospace; font-size: 11px; padding: 5px 8px; cursor: pointer; outline: none; }
  .lang-select:focus { border-color: var(--accent); }
  .code-editor-container { flex: 1; display: flex; overflow: hidden; background: var(--bg); }
  .line-numbers { padding: 18px 0; min-width: 44px; background: var(--bg1); border-right: 1px solid var(--border); color: var(--text3); font-family: 'Space Mono', monospace; font-size: 12px; line-height: 1.7; text-align: right; user-select: none; overflow: hidden; flex-shrink: 0; }
  .line-numbers span { display: block; padding: 0 10px; }
  .code-textarea { flex: 1; padding: 18px 18px 18px 14px; resize: none; background: transparent; border: none; outline: none; color: var(--text); font-family: 'Space Mono', monospace; font-size: 13px; line-height: 1.7; tab-size: 4; overflow: auto; white-space: pre; }
  .editor-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* Match bar */
  .match-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 12px; }
  .match-player { display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 6px; background: var(--bg1); border: 1px solid var(--border); font-size: 12px; font-weight: 500; }
  .match-vs { color: var(--text3); font-weight: 700; font-size: 11px; font-family: 'Space Mono', monospace; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot-yellow { background: var(--yellow2); animation: pulse 1.5s ease infinite; }
  .dot-red { background: var(--red); }
  .verdict-chip { padding: 1px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
  .verdict-accepted { background: rgba(63,185,80,0.15); color: var(--green); }
  .verdict-wrong { background: rgba(248,81,73,0.15); color: var(--red); }
  .verdict-pending { background: rgba(227,179,65,0.12); color: var(--yellow2); }
  .verdict-tle { background: rgba(188,140,255,0.12); color: var(--purple); }
  .you-badge { font-size: 9px; font-weight: 700; color: var(--accent); background: rgba(0,212,255,0.12); padding: 1px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Results */
  .result-pane { flex: 1; overflow-y: auto; padding: 24px; }
  .verdict-banner { display: flex; align-items: center; gap: 16px; padding: 18px 22px; border-radius: 10px; margin-bottom: 20px; border: 1px solid; }
  .verdict-banner.accepted { background: rgba(63,185,80,0.06); border-color: rgba(63,185,80,0.2); }
  .verdict-banner.wrong, .verdict-banner.tle { background: rgba(248,81,73,0.06); border-color: rgba(248,81,73,0.2); }
  .verdict-banner.pending { background: rgba(227,179,65,0.06); border-color: rgba(227,179,65,0.2); }
  .verdict-emoji { font-size: 30px; }
  .verdict-label { font-size: 17px; font-weight: 700; margin-bottom: 3px; }
  .verdict-sub { font-size: 12px; color: var(--text2); }
  .result-section-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); margin-bottom: 10px; font-family: 'Space Mono', monospace; }
  .player-result-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; border-radius: 8px; margin-bottom: 6px; border: 1px solid; }
  .player-result-row.me { background: rgba(0,212,255,0.04); border-color: rgba(0,212,255,0.15); }
  .player-result-row.other { background: var(--bg2); border-color: var(--border); }
  .history-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 12px; border-radius: 6px; margin-bottom: 4px; background: var(--bg2); border: 1px solid var(--border); }

  /* Queue */
  .queue-page { flex: 1; display: flex; align-items: center; justify-content: center; }
  .queue-card { width: 420px; text-align: center; background: var(--bg1); border: 1px solid var(--border); border-radius: 14px; padding: 48px 40px; }
  .queue-icon { font-size: 52px; margin-bottom: 18px; }
  .queue-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .queue-sub { color: var(--text2); font-size: 13px; margin-bottom: 28px; line-height: 1.7; }
  .queue-spinner { width: 44px; height: 44px; margin: 0 auto 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }

  /* Leaderboard */
  .leaderboard-page { padding: 24px; }
  .lb-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 18px; background: var(--bg1); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; transition: all 0.12s; }
  .lb-row:hover { border-color: var(--border2); background: var(--bg2); }
  .lb-left { display: flex; align-items: center; gap: 14px; }
  .lb-rank { color: var(--text3); font-size: 11px; font-family: 'Space Mono', monospace; width: 28px; }
  .lb-rank.top { color: var(--yellow2); }
  .lb-name { font-size: 13px; font-weight: 500; }
  .lb-elo { color: var(--accent); font-weight: 700; font-size: 14px; font-family: 'Space Mono', monospace; }

  /* Toast */
  .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast { padding: 11px 16px; border-radius: 8px; font-size: 12px; font-weight: 500; border: 1px solid; max-width: 300px; pointer-events: all; animation: toastIn 0.2s ease; }
  .toast-success { background: rgba(63,185,80,0.12); border-color: rgba(63,185,80,0.3); color: #7ee787; }
  .toast-error { background: rgba(248,81,73,0.12); border-color: rgba(248,81,73,0.3); color: #ff7b72; }
  .toast-info { background: rgba(0,212,255,0.1); border-color: rgba(0,212,255,0.25); color: var(--accent3); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 13px; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes toastIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp 0.22s ease; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const API = 'https://codebattle-production-9995.up.railway.app';

async function api(method, path, body, token) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json();
  if (!res.ok) throw new Error(data.detail || 'Request failed');
  return data;
}

function Toast({ toasts }) {
  return <div className="toast-container">{toasts.map(t => <div key={t.id} className={`toast toast-${t.type}`}>{t.msg}</div>)}</div>;
}
function useToasts() {
  const [toasts, setToasts] = useState([]);
  const toast = useCallback((msg, type = 'info') => {
    const id = Date.now();
    setToasts(p => [...p, { id, msg, type }]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3500);
  }, []);
  return { toasts, toast };
}

function AuthPage({ onLogin, toast }) {
  const [tab, setTab] = useState('login');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  const [form, setForm] = useState({ name: '', email: '', password: '' });
  const set = k => e => setForm(p => ({ ...p, [k]: e.target.value }));

  async function submit() {
    setErr(''); setLoading(true);
    try {
      if (tab === 'login') {
        const data = await api('POST', '/login', { email: form.email, password: form.password });
        onLogin(data.access_token, data.user); toast('Welcome back!', 'success');
      } else {
        await api('POST', '/users/', { name: form.name, email: form.email, password: form.password });
        const data = await api('POST', '/login', { email: form.email, password: form.password });
        onLogin(data.access_token, data.user); toast('Account created!', 'success');
      }
    } catch (e) { setErr(e.message); } finally { setLoading(false); }
  }

  return (
    <div className="auth-page">
      <div className="auth-wrap fade-up">
        <div className="auth-header">
          <div className="auth-logo">[<span>code</span>battle]</div>
          <div className="auth-tagline">// competitive programming arena</div>
        </div>
        <div className="auth-card">
          <div className="auth-tabs">
            {['login','register'].map(t => (
              <div key={t} className={`auth-tab ${tab===t?'active':''}`} onClick={() => { setTab(t); setErr(''); }}>
                {t === 'login' ? 'Sign In' : 'Register'}
              </div>
            ))}
          </div>
          <div className="auth-body">
            {tab === 'register' && <div className="form-group"><label className="form-label">Name</label><input className="form-input" placeholder="Alice" value={form.name} onChange={set('name')} /></div>}
            <div className="form-group"><label className="form-label">Email</label><input className="form-input" type="email" placeholder="alice@example.com" value={form.email} onChange={set('email')} /></div>
            <div className="form-group"><label className="form-label">Password</label><input className="form-input" type="password" placeholder="••••••••" value={form.password} onChange={set('password')} onKeyDown={e => e.key==='Enter' && submit()} /></div>
            {err && <div className="form-error">⚠ {err}</div>}
            <button className="btn btn-primary btn-lg" style={{ width:'100%', marginTop:18 }} onClick={submit} disabled={loading}>
              {loading ? '...' : tab==='login' ? 'Sign In →' : 'Create Account →'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ProblemsPage({ token, onSelect, toast }) {
  const [problems, setProblems] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    api('GET', '/problems', null, token).then(setProblems).catch(e => toast(e.message, 'error')).finally(() => setLoading(false));
  }, []);
  const diffBadge = d => { const c = d==='Easy'?'easy':d==='Medium'?'medium':'hard'; return <span className={`badge badge-${c}`}>{d}</span>; };
  return (
    <div className="problems-page">
      <div className="page-header"><div className="page-title">Problems</div><div className="page-sub">// select a problem to practice or battle</div></div>
      {loading ? <div className="empty-state">Loading...</div> : (
        <div className="problem-grid">
          {problems.map((p, i) => (
            <div key={p.id} className="problem-card" onClick={() => onSelect(p)}>
              <div className="problem-left">
                <div className="problem-num">{String(i+1).padStart(2,'0')}</div>
                <div className="problem-name">{p.title}</div>
              </div>
              <div className="problem-right">{diffBadge(p.difficulty)}<span style={{color:'var(--text3)',fontSize:11}}>›</span></div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

const PROBLEM_STARTERS = {
  'Two Sum': {
    python: `def solve(nums, target):\n    # Return indices of two numbers that add up to target\n    pass\n`,
    javascript: `function solve(nums, target) {\n    // Return indices of two numbers that add up to target\n}\n`,
    cpp: `#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    // Two Sum\n    return 0;\n}\n`,
    java: `public class Solution {\n    public static void main(String[] args) {\n        // Two Sum\n    }\n}\n`,
  },
  'Valid Palindrome': {
    python: `def solve(s):\n    # Return true if s is a palindrome (alphanumeric only, case-insensitive)\n    pass\n`,
    javascript: `function solve(s) {\n    // Return true if s is a palindrome\n}\n`,
    cpp: `#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    // Valid Palindrome\n    return 0;\n}\n`,
    java: `public class Solution {\n    public static void main(String[] args) {\n        // Valid Palindrome\n    }\n}\n`,
  },
  'Maximum Subarray': {
    python: `def solve(nums):\n    # Return the largest sum of any contiguous subarray\n    pass\n`,
    javascript: `function solve(nums) {\n    // Return the largest sum of any contiguous subarray\n}\n`,
    cpp: `#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    // Maximum Subarray\n    return 0;\n}\n`,
    java: `public class Solution {\n    public static void main(String[] args) {\n        // Maximum Subarray\n    }\n}\n`,
  },
  'Valid Parentheses': {
    python: `def solve(s):\n    # Return true if the bracket string is valid\n    pass\n`,
    javascript: `function solve(s) {\n    // Return true if the bracket string is valid\n}\n`,
    cpp: `#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    // Valid Parentheses\n    return 0;\n}\n`,
    java: `public class Solution {\n    public static void main(String[] args) {\n        // Valid Parentheses\n    }\n}\n`,
  },
};
const DEFAULT_STARTERS = {
  python: `def solve():\n    # You can name this function anything\n    pass\n`,
  javascript: `function solve() {\n    // You can name this function anything\n}\n`,
  cpp: `#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}\n`,
  java: `public class Solution {\n    public static void main(String[] args) {\n        // Write your solution here\n    }\n}\n`,
};
function getStarter(title, lang) { return (PROBLEM_STARTERS[title] || DEFAULT_STARTERS)[lang] || DEFAULT_STARTERS[lang] || ''; }

function LineNumbers({ code }) {
  const count = code.split('\n').length;
  return (
    <div className="line-numbers">
      {Array.from({ length: count }, (_, i) => <span key={i}>{i+1}</span>)}
    </div>
  );
}

function SolveView({ problem, token, user, matchId, matchPlayers, mode, toast, onBack, onResult }) {
  const [code, setCode] = useState(() => getStarter(problem.title, 'python'));
  const [lang, setLang] = useState('python');
  const [submitting, setSubmitting] = useState(false);
  const [result, setResult] = useState(null);
  const [activeTab, setActiveTab] = useState('code');
  const [submissions, setSubmissions] = useState([]);
  const pollRef = useRef(null);

  useEffect(() => { setCode(getStarter(problem.title, lang)); }, [lang]);
  useEffect(() => () => clearInterval(pollRef.current), []);

  function startPolling(mid) {
    let attempts = 0;
    pollRef.current = setInterval(async () => {
      attempts++;
      try {
        const data = await api('GET', `/match/${mid}/result/${user.id}`, null, token);
        if (data.my_verdict && data.my_verdict !== 'pending') {
          clearInterval(pollRef.current);
          setResult(data); setSubmitting(false); setActiveTab('result');
          setSubmissions(prev => [{ ...data, submittedAt: new Date() }, ...prev]);
          if (onResult) onResult(data);
        }
        if (attempts > 45) {
          clearInterval(pollRef.current); setSubmitting(false);
          toast('Worker did not respond in 90s', 'error'); setActiveTab('result');
          setSubmissions(prev => [{ my_verdict: 'timeout', submittedAt: new Date() }, ...prev]);
        }
      } catch (e) { if (attempts > 45) { clearInterval(pollRef.current); setSubmitting(false); toast(e.message, 'error'); } }
    }, 2000);
  }

  async function handleSubmit() {
    setSubmitting(true); setResult(null);
    try {
      const endpoint = mode === 'practice' ? `/practice/${problem.id}/submit` : `/match/${matchId}/submit`;
      const data = await api('POST', endpoint, { code, language: lang }, token);
      toast('Submitted! Judging...', 'info');
      startPolling(data.match_id);
    } catch (e) { setSubmitting(false); toast(e.message, 'error'); }
  }

  function handleKeyDown(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = e.target.selectionStart, v = e.target.value;
      const next = v.slice(0, s) + '    ' + v.slice(e.target.selectionEnd);
      setCode(next);
      setTimeout(() => e.target.setSelectionRange(s+4, s+4), 0);
    }
  }

  const VM = { accepted: { color:'var(--green)', icon:'✓', label:'Accepted', cls:'accepted' }, wrong: { color:'var(--red)', icon:'✗', label:'Wrong Answer', cls:'wrong' }, tle: { color:'var(--purple)', icon:'⏱', label:'Time Limit Exceeded', cls:'tle' }, pending: { color:'var(--yellow2)', icon:'…', label:'Pending', cls:'pending' } };
  const verdictMeta = v => VM[v] || { color:'var(--text3)', icon:'?', label: v||'Unknown', cls:'wrong' };
  const vm = result ? verdictMeta(result.my_verdict) : null;

  return (
    <div className="split-view">
      <div className="split-left">
        <div className="panel-header">
          <button className="btn btn-ghost btn-sm" onClick={onBack}>← Back</button>
          <span className={`badge badge-${(problem.difficulty||'').toLowerCase()}`}>{problem.difficulty}</span>
        </div>
        <div className="panel-body">
          <div className="prob-title">{problem.title}</div>
          <div className="prob-desc">{problem.description}</div>
        </div>
      </div>

      <div className="split-right">
        {mode === 'match' && matchPlayers && (
          <div className="match-bar">
            {matchPlayers.map((p, i) => (
              <React.Fragment key={p.user_id}>
                <div className="match-player">
                  <span className={`status-dot ${p.verdict==='accepted'?'dot-green':p.verdict==='pending'?'dot-yellow':'dot-red'}`} />
                  <span style={{fontWeight: p.user_id===user.id?700:400}}>{p.name}</span>
                  {p.user_id===user.id && <span className="you-badge">you</span>}
                  {p.verdict!=='pending' && <span className={`verdict-chip verdict-${p.verdict}`}>{p.verdict}</span>}
                </div>
                {i < matchPlayers.length-1 && <div className="match-vs">VS</div>}
              </React.Fragment>
            ))}
          </div>
        )}

        <div className="editor-toolbar">
          <div className="editor-tabs">
            <button className={`editor-tab ${activeTab==='code'?'active':''}`} onClick={() => setActiveTab('code')}>✎ Code</button>
            <button className={`editor-tab ${activeTab==='result'?'active':''}`} onClick={() => setActiveTab('result')}>
              {submitting ? <span style={{color:'var(--yellow2)'}}>⏳ Judging</span> : vm ? <span style={{color:vm.color}}>{vm.icon} {vm.label}</span> : '◎ Result'}
            </button>
          </div>
          <div className="editor-controls">
            <select className="lang-select" value={lang} onChange={e => setLang(e.target.value)}>
              <option value="python">Python</option>
              <option value="javascript">JavaScript</option>
              <option value="cpp">C++</option>
              <option value="java">Java</option>
            </select>
            <button className="btn btn-success btn-sm" onClick={handleSubmit} disabled={submitting}>
              {submitting ? '⏳' : '▶ Run'}
            </button>
          </div>
        </div>

        {activeTab === 'code' && (
          <div className="editor-wrap">
            <div className="code-editor-container">
              <LineNumbers code={code} />
              <textarea className="code-textarea" value={code} onChange={e => setCode(e.target.value)} onKeyDown={handleKeyDown} spellCheck={false} autoCapitalize="none" autoCorrect="off" />
            </div>
          </div>
        )}

        {activeTab === 'result' && (
          <div className="result-pane">
            {submitting && !result && (
              <div className="empty-state">
                <div className="queue-spinner" style={{width:36,height:36,margin:'0 auto 16px'}} />
                <div>Running test cases...</div>
              </div>
            )}
            {!submitting && !result && <div className="empty-state">No submissions yet.<br/>Hit ▶ Run to execute your code.</div>}
            {result && (() => {
              const v = result.my_verdict, meta = verdictMeta(v);
              return (
                <div className="fade-up">
                  <div className={`verdict-banner ${meta.cls}`}>
                    <div className="verdict-emoji">{v==='accepted'?'✅':v==='tle'?'⏱️':'❌'}</div>
                    <div>
                      <div className="verdict-label" style={{color:meta.color}}>{meta.label}</div>
                      <div className="verdict-sub">{v==='accepted'?'All test cases passed.':v==='tle'?'Exceeded time limit on one or more test cases.':'Output did not match expected.'}</div>
                    </div>
                  </div>
                  {result.players && result.players.length > 1 && (
                    <div style={{marginBottom:20}}>
                      <div className="result-section-title">Match Results</div>
                      {result.players.map(p => { const pm = verdictMeta(p.verdict), isMe = p.user_id===user.id; return (
                        <div key={p.user_id} className={`player-result-row ${isMe?'me':'other'}`}>
                          <div style={{display:'flex',alignItems:'center',gap:6}}>
                            <span style={{fontSize:13,fontWeight:isMe?700:400}}>{p.name}</span>
                            {isMe && <span className="you-badge">you</span>}
                          </div>
                          <span style={{fontSize:12,color:pm.color,fontWeight:600}}>{pm.icon} {pm.label}</span>
                        </div>
                      ); })}
                    </div>
                  )}
                  {submissions.length > 1 && (
                    <div>
                      <div className="result-section-title">History</div>
                      {submissions.map((s, i) => { const sm = verdictMeta(s.my_verdict); return (
                        <div key={i} className="history-row" style={{opacity:i===0?1:0.55}}>
                          <span style={{fontSize:11,color:'var(--text3)'}}>{i===0?'Latest':`#${submissions.length-i}`}</span>
                          <span style={{fontSize:11,color:sm.color,fontWeight:600}}>{sm.icon} {sm.label}</span>
                          <span style={{fontSize:10,color:'var(--text3)',fontFamily:'Space Mono,monospace'}}>{s.submittedAt?.toLocaleTimeString()}</span>
                        </div>
                      ); })}
                    </div>
                  )}
                  <div style={{marginTop:20,display:'flex',gap:8}}>
                    <button className="btn btn-ghost btn-sm" onClick={() => setActiveTab('code')}>← Editor</button>
                    {v !== 'accepted' && <button className="btn btn-primary btn-sm" onClick={() => setActiveTab('code')}>Try Again</button>}
                  </div>
                </div>
              );
            })()}
          </div>
        )}
      </div>
    </div>
  );
}

function LeaderboardPage({ token, user, toast }) {
  const [players, setPlayers] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => { api('GET', '/leaderboard', null, token).then(setPlayers).catch(e => toast(e.message, 'error')).finally(() => setLoading(false)); }, []);
  return (
    <div className="leaderboard-page">
      <div className="page-header"><div className="page-title">Leaderboard</div><div className="page-sub">// ranked by ELO rating</div></div>
      {loading ? <div className="empty-state">Loading...</div> : players.map((p, i) => (
        <div key={p.id} className="lb-row">
          <div className="lb-left">
            <div className={`lb-rank ${i<3?'top':''}`}>{i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`}</div>
            <div className="lb-name" style={{fontWeight:p.id===user.id?700:400}}>{p.name}{p.id===user.id && <span className="you-badge" style={{marginLeft:8}}>you</span>}</div>
          </div>
          <div className="lb-elo">{p.elo}</div>
        </div>
      ))}
    </div>
  );
}

function QueuePage({ token, user, toast, onMatchFound }) {
  const [status, setStatus] = useState('idle');
  const pollRef = useRef(null);

  async function joinQueue() {
    setStatus('waiting');
    try {
      const data = await api('POST', '/queue/join?elo=1000', null, token);
      if (data.status === 'matched') {
        setStatus('matched'); toast('Match found! 🔥', 'success');
        const match = await api('GET', `/match/${data.match_id}`, null, token);
        onMatchFound(match);
      } else {
        pollRef.current = setInterval(async () => {
          try {
            const d = await api('GET', '/queue/status', null, token);
            if (d.status === 'matched') {
              clearInterval(pollRef.current); setStatus('matched'); toast('Match found! 🔥', 'success');
              const match = await api('GET', `/match/${d.match_id}`, null, token);
              onMatchFound(match);
            }
          } catch {}
        }, 3000);
      }
    } catch (e) { setStatus('idle'); toast(e.message, 'error'); }
  }

  async function leaveQueue() {
    clearInterval(pollRef.current);
    try { await api('DELETE', '/queue/leave', null, token); } catch {}
    setStatus('idle');
  }
  useEffect(() => () => clearInterval(pollRef.current), []);

  return (
    <div className="queue-page">
      <div className="queue-card fade-up">
        {status === 'idle' && (<><div className="queue-icon">⚔️</div><div className="queue-title">Battle Arena</div><div className="queue-sub">Get matched with a player of similar skill and race to solve a problem first.</div><button className="btn btn-primary btn-lg" onClick={joinQueue}>Find Match →</button></>)}
        {status === 'waiting' && (<><div className="queue-spinner" /><div className="queue-title">Finding Opponent...</div><div className="queue-sub">Searching for a worthy challenger</div><button className="btn btn-ghost" onClick={leaveQueue}>Cancel</button></>)}
        {status === 'matched' && (<><div className="queue-icon">🔥</div><div className="queue-title">Match Found!</div><div className="queue-sub">Loading your match...</div></>)}
      </div>
    </div>
  );
}

function HomePage({ user, onNavigate }) {
  return (
    <div className="content">
      <div className="home-page fade-up">
        <div className="home-greeting">// welcome back</div>
        <div className="home-title">Hello, <span>{user.name}</span>.</div>
        <div className="home-desc">Ready to code? Practice on your own or jump into a live battle.</div>
        <div className="home-cards">
          <div className="home-card" onClick={() => onNavigate('problems')}><div className="home-card-icon">📋</div><div className="home-card-title">Practice</div><div className="home-card-desc">Solve problems at your own pace.</div></div>
          <div className="home-card" onClick={() => onNavigate('queue')}><div className="home-card-icon">⚔️</div><div className="home-card-title">Battle</div><div className="home-card-desc">Race against an opponent in real time.</div></div>
          <div className="home-card" onClick={() => onNavigate('leaderboard')}><div className="home-card-icon">🏆</div><div className="home-card-title">Leaderboard</div><div className="home-card-desc">See where you rank by ELO.</div></div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [token, setToken] = useState(() => localStorage.getItem('cb_token'));
  const [user, setUser] = useState(() => { try { return JSON.parse(localStorage.getItem('cb_user')); } catch { return null; } });
  const [page, setPage] = useState('home');
  const [selectedProblem, setSelectedProblem] = useState(null);
  const [activeMatch, setActiveMatch] = useState(null);
  const { toasts, toast } = useToasts();

  function onLogin(t, u) { setToken(t); setUser(u); localStorage.setItem('cb_token', t); localStorage.setItem('cb_user', JSON.stringify(u)); setPage('home'); }
  function logout() { setToken(null); setUser(null); localStorage.removeItem('cb_token'); localStorage.removeItem('cb_user'); setPage('home'); }
  function selectProblem(p) { setSelectedProblem(p); setActiveMatch(null); setPage('solve-practice'); }
  function onMatchFound(match) { setActiveMatch(match); setSelectedProblem(match.problem); setPage('solve-match'); }

  if (!token || !user) return <div className="app"><AuthPage onLogin={onLogin} toast={toast} /><Toast toasts={toasts} /></div>;

  const isSolving = page === 'solve-practice' || page === 'solve-match';

  return (
    <div className="app">
      <nav className="nav">
        <div className="nav-logo"><span className="nav-logo-bracket">[</span>cb<span className="nav-logo-bracket">]</span><span style={{color:'var(--text2)',fontWeight:400,fontSize:13}}>codebattle</span></div>
        <div className="nav-right"><span className="nav-user">@{user.name}</span><button className="btn btn-ghost btn-sm" onClick={logout}>Sign Out</button></div>
      </nav>
      <div className="main">
        {!isSolving && (
          <div className="sidebar">
            <div className="sidebar-section">
              <div className="sidebar-label">Navigate</div>
              {[{key:'home',icon:'⌂',label:'Home'},{key:'problems',icon:'#',label:'Problems'},{key:'queue',icon:'⚔',label:'Battle'},{key:'leaderboard',icon:'◈',label:'Leaderboard'}].map(item => (
                <button key={item.key} className={`sidebar-btn ${page===item.key?'active':''}`} onClick={() => setPage(item.key)}>
                  <span className="sidebar-icon">{item.icon}</span>{item.label}
                </button>
              ))}
            </div>
          </div>
        )}
        {page==='home' && <HomePage user={user} onNavigate={setPage} />}
        {page==='problems' && <div className="content"><ProblemsPage token={token} onSelect={selectProblem} toast={toast} /></div>}
        {page==='queue' && <QueuePage token={token} user={user} toast={toast} onMatchFound={onMatchFound} />}
        {page==='leaderboard' && <div className="content"><LeaderboardPage token={token} user={user} toast={toast} /></div>}
        {page==='solve-practice' && selectedProblem && <SolveView problem={selectedProblem} token={token} user={user} mode="practice" toast={toast} onBack={() => setPage('problems')} onResult={() => {}} />}
        {page==='solve-match' && selectedProblem && activeMatch && <SolveView problem={selectedProblem} token={token} user={user} mode="match" matchId={activeMatch.match_id} matchPlayers={activeMatch.players} toast={toast} onBack={() => setPage('home')} onResult={() => {}} />}
      </div>
      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
